services:
  patria:
    image: ${PATRIA_IMAGE:-supersouris7/patria:unstable}
    container_name: patria
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-8101}:8080"
    volumes:
      - patrimoine_data:/data
    restart: unless-stopped
    # Durcissement : systeme de fichiers en lecture seule (seuls /data et /tmp s'ecrivent), aucun privilege ajoute.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  patrimoine_data:
