<!doctype html>
<html lang="fr" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion · Patria</title>
    <link rel="stylesheet" th:href="@{/css/patria.css}">
</head>
<body class="login-page">
<main class="login-card">
    <a class="brand" th:href="@{/}">Patria<span>.</span></a>
    <p class="eyebrow">SUIVI IMMOBILIER</p>
    <h1>Connexion</h1>
    <p class="muted">Vos donnees restent sur votre serveur.</p>
    <p class="notice error" th:if="${param.error}">Mot de passe incorrect.</p>
    <p class="notice success" th:if="${param.logout}">Vous etes deconnecte.</p>
    <form method="post" th:action="@{/connexion}" class="stack">
        <input type="hidden" name="username" value="patria">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Mot de passe
            <input name="password" type="password" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit">Ouvrir Patria</button>
    </form>
</main>
</body>
</html>
