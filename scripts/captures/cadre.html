<!doctype html>
<!-- Cadre des captures de la documentation (rempli par make.sh) --><html><head><meta charset="utf-8"><style>
html,body{margin:0}
html,body{background:transparent;font-family:system-ui,sans-serif}
.win{width:1278px;border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #2a3240}
.bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#161b22;border-bottom:1px solid #222a35}
.dot{width:12px;height:12px;border-radius:50%}
.url{margin-left:18px;flex:1;max-width:520px;height:26px;border-radius:7px;background:#0d1117;color:#8b98a8;font-size:13px;display:flex;align-items:center;padding:0 12px;gap:8px}
img{display:block;width:1278px;height:799px}
</style></head><body><div class="win"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
<span class="url">{{LOCK}} {{URL}}</span></div><img src="{{IMAGE}}"></div></body></html>
