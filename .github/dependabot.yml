# Mises a jour proposees en pull request (jamais publiees sans relecture) : image de base figee par empreinte,
# actions GitHub et dependances Maven.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Java : on reste sur une version LTS ; un changement de version majeure se decide explicitement.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
      - dependency-name: maven
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
