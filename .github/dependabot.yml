# Mises a jour proposees en pull request (jamais publiees sans relecture) : image de base figee par empreinte,
# actions GitHub et dependances Maven.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
